default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: diet_user
  password: password
  host: 127.0.0.1
  port: 3306

development:
  <<: *default
  database: diet_app_backend_development

test:
  <<: *default
  database: diet_app_backend_test

production:
  primary:
    adapter: sqlite3
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    database: storage/production.sqlite3
  cable:
    adapter: sqlite3
    database: storage/production_cable.sqlite3
  queue:
    adapter: sqlite3
    database: storage/production_queue.sqlite3
  cache:
    adapter: sqlite3
    database: storage/production_cache.sqlite3