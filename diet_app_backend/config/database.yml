default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: diet_user
  password: password
  host: 127.0.0.1
  port: 3306

development:
  <<: *default
  database: diet_app_backend_development

test:
  <<: *default
  database: diet_app_backend_test

production:
  primary:
    <<: *default
    database: diet_app_backend_production
  cable:
    <<: *default
    database: diet_app_backend_production
  queue:
    <<: *default
    database: diet_app_backend_production